[package]
name = "arma-reforger-fire-control"
version = "3.8.2"
description = "Arma Reforger Fire Control for Windows"
authors = ["Arma Reforger Fire Control Project"]
edition = "2021"
rust-version = "1.90"

[[bin]]
name = "arma_reforger_fire_control"
path = "src/main.rs"

[lib]
name = "arma_reforger_fire_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
signed-updates = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-http = "2"
serde_json = "1"

# Compiled in only for official releases with a configured public signing key.
[target.'cfg(windows)'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }

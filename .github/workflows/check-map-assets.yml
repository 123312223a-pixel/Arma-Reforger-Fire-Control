name: Validate map assets
on:
  pull_request:
    paths:
      - 'src/map-resources.mjs'
      - 'src/map-mode.js'
      - 'scripts/check-map-resources.mjs'
      - 'package.json'
      - '.github/workflows/check-map-assets.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:map-resources
      - run: npm run test:heightmap
      - run: npm run test:map-catalog
      - run: npm run check:bundle
  network:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:map-resources:network

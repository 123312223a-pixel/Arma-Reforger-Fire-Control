name: Release signed Windows update

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Verify signing configuration and configure trusted update endpoint
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          FIRE_CONTROL_REPOSITORY: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_UPDATER_PUBLIC_KEY) { throw 'Set repository variable TAURI_UPDATER_PUBLIC_KEY first' }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Set secret TAURI_SIGNING_PRIVATE_KEY first' }
          node scripts/configure-updater.mjs
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("${{ github.ref_name }}" -ne "v$version") { throw "Git tag must match package version v$version" }
      - name: Install npm dependencies
        run: npm install
      - name: Create Windows app icons
        run: npm run icon
      - name: Verify source and signed-update endpoint
        run: npm run release:verify
      - name: Build signed NSIS and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Arma Reforger Fire Control v__VERSION__
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: '--features signed-updates --config src-tauri/tauri.updater.conf.json'

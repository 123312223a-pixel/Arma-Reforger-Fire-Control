name: Release signed Windows update

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Require signing secrets and configure trusted update channel
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          FIRE_CONTROL_REPOSITORY: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_UPDATER_PUBLIC_KEY) { throw 'Set vars.TAURI_UPDATER_PUBLIC_KEY first.' }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Set secrets.TAURI_SIGNING_PRIVATE_KEY first.' }
          node scripts/configure-updater.mjs
      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          if ("${{ github.ref_name }}" -ne "v$v") { throw "Git tag must be v$v" }
      - name: Install npm dependencies
        run: npm install
      - name: Verify core and configured channel
        run: npm run release:verify
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Arma Reforger Fire Control v__VERSION__'
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
          args: '--features signed-updates --config src-tauri/tauri.updater.conf.json'

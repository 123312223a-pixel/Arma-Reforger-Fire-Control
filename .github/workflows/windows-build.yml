name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install npm dependencies
        run: npm install
      - name: Verify bundled calculation core and project
        run: npm run check
      - name: Verify interactive map is included in build
        shell: pwsh
        run: |
          npm run build:web
          node scripts/verify-bundle.mjs
      - name: Build NSIS installer
        run: npm run build
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Arma-Reforger-Fire-Control-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
